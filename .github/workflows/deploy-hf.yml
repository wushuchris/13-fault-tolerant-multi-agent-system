name: Deploy to Hugging Face

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      HF_DEPLOY_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
      HF_SPACE_ID: FlyingNunchucks/13-fault-tolerant-multi-agent-system
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check deployment configuration
        id: config
        run: |
          if [ -n "$HF_DEPLOY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Hugging Face deployment is configured for $HF_SPACE_ID."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_DEPLOY_TOKEN is not configured yet; deployment sync is skipped."
          fi

      - name: Check out tested commit
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deployment client
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install "huggingface_hub==1.33.0"

      - name: Build public Space bundle
        if: steps.config.outputs.configured == 'true'
        run: python scripts/build_space_bundle.py --output .hf_bundle

      - name: Sync tested bundle to Hugging Face
        if: steps.config.outputs.configured == 'true'
        run: python scripts/deploy_space.py
